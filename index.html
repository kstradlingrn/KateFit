 // Never throw away completed sets. Only trim unfinished items.
 while(oldStrength.length>num){let ix=oldStrength.findLastIndex(e=>!e.sets.some(x=>x.done));if(ix<0)break;oldStrength.splice(ix,1)}
 while(oldStrength.length<num){const used=new Set(oldStrength.map(e=>e.id));const candidate=library().find(e=>e.type==='strength'&&compatible(e)&&!used.has(e.id)&&(S.prefs[e.id]||'neutral')!=='never');if(!candidate)break;oldStrength.push(makeWorkoutEx(candidate))}
 if(cardio>0){if(!oldCardio.length)oldCardio=buildCardioItems(cardio,S.cardioCount||2);else{const done=oldCardio.reduce((sum,e)=>sum+(e.sets||[]).filter(x=>x.done).reduce((a,x)=>a+(+x.minutes||0),0),0);const pending=oldCardio.filter(e=>!(e.sets||[]).some(x=>x.done));const remaining=Math.max(0,cardio-done);if(pending.length){pending.forEach((e,i)=>e.sets[0].minutes=Math.floor(remaining/pending.length)+(i===0?remaining%pending.length:0))}else if(remaining>0){const x=buildCardioItems(remaining,1)[0];if(x)oldCardio.push(x)}}}else oldCardio=oldCardio.filter(e=>(e.sets||[]).some(s=>s.done));
 w.exercises=[...oldStrength,...oldCardio];w.kind=type==='both'?'combined':type==='cardio'?'conditioning':'strength';w.title=type==='both'?'Strength + Cardio':type==='cardio'?'Cardio Workout':'Adaptive Strength';w.minutes=total;w.cardioMinutes=cardio;coachIndex=Math.max(0,Math.min(coachIndex,w.exercises.length-1));save();saveActive();closeModal();render();toast('Workout updated; completed sets kept')}

function load(){try{let x=JSON.parse(localStorage.getItem('forgefit'));return merge(DEFAULT,x)}catch(e){return structuredClone(DEFAULT)}}
function merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a;if(a&&typeof a==='object'){const o={};for(const k in a)o[k]=merge(a[k],b?.[k]);for(const k in b||{})if(!(k in o))o[k]=b[k];return o}return b===undefined?a:b}
function save(){localStorage.setItem('forgefit',JSON.stringify(S))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function daysAgo(d){return (Date.now()-new Date(d).getTime())/864e5}
function muscleRecovery(m){const entries=S.workouts.filter(w=>w.completed).flatMap(w=>w.exercises.filter(e=>e.p===m||e.s.includes(m)).map(e=>({d:w.date,sets:e.sets.filter(s=>s.done).length,fb:e.feedback}))).sort((a,b)=>new Date(b.d)-new Date(a.d));if(!entries.length)return 100;const x=entries[0];const half= m==='Quadriceps'||m==='Glutes'||m==='Hamstrings'?50:38;let fatigue=Math.min(70,18+x.sets*9+(x.fb==='tooHard'?14:x.fb==='hard'?7:0));return Math.round(Math.min(100,Math.max(18,100-fatigue*Math.exp(-daysAgo(x.d)*24/half))))}
function readinessScore(){let v=70;if(S.readiness.energy==='low')v-=20;if(S.readiness.energy==='great')v+=15;if(S.readiness.soreness==='none')v+=10;if(S.readiness.soreness==='aLot')v-=25;return Math.max(0,Math.min(100,v))}
function weekStrengthCount(){const cutoff=Date.now()-7*864e5;return new Set(S.workouts.filter(w=>w.completed&&w.kind==='strength'&&new Date(w.date).getTime()>cutoff).map(w=>new Date(w.date).toDateString())).size}
function profileEquipment(){
 const p=S.profile, supports=p.supports||[];
 return [...(p.bodyweight!==false?['bodyweight']:[]),...(p.homeDB||[]).length?['dumbbells']:[],...(p.bands!==false&&(p.bandColors||[]).length?['bands']:[]),...(p.bandAnchor?['anchor']:[]),...(p.gymBench?['bench']:[]),...(p.kettlebellWeights||[]).length?['kettlebell']:[],...(p.cableMachine?['cable']:[]),...supports,'outdoors'];

function locationEq(){return profileEquipment()}
function isFloorExercise(ex){return /\b(lie flat|lying flat|lie on your back|supine|floor press|heel slide)\b/i.test((ex.name||'')+' '+(ex.steps||[]).join(' '))}
function isStandingExercise(ex){return /\b(standing|stand|wall push|countertop push|stairs|step-up|hill walk)\b/i.test((ex.name||'')+' '+(ex.steps||[]).join(' '))}
function isSeatedExercise(ex){return /\b(seated|chair|sitting)\b/i.test((ex.name||'')+' '+(ex.steps||[]).join(' '))}
function compatible(ex){return ex.eq.every(q=>locationEq().includes(q)) && !((S.profile.avoidHeadFlat || (S.readiness.badDay && S.profile.badDayUpright!==false)) && isFloorExercise(ex)) && !(S.profile.avoidStanding && isStandingExercise(ex)) && !(S.profile.avoidSeated && isSeatedExercise(ex))}

function equipmentSummary(){const p=S.profile;return `<p class="small"><b>Selected:</b> ${[p.bodyweight?'Bodyweight':null,...(p.homeDB||[]).map(x=>x+' lb dumbbell'),...(p.bandColors||[]).map(x=>x+' band'),...(p.kettlebellWeights||[]).map(x=>x+' lb kettlebell'),p.cableMachine?'Cable machine':null,...(p.supports||[])].filter(Boolean).join(' · ')||'No equipment selected'}</p>`}

function browseLibrary(kind='strength'){
 const all=library().filter(x=>x.type===(kind==='cardio'?'conditioning':'strength'));
 const available=all.filter(x=>compatible(x));
 showModal(`<h2>${kind==='cardio'?'Cardio':'Strength'} exercise library</h2><p class="muted small">${all.length} choices · ${available.length} match your selected equipment. Browse all to see what equipment you would need. Never place your head below your heart.</p><div class="field"><label>Search exercises</label><input id="exercise-search" placeholder="Search name or muscle" oninput="filterLibraryItems(this.value)"></div><div class="field"><label><input id="only-compatible" type="checkbox" checked onchange="filterLibraryItems(document.getElementById('exercise-search').value)"> Show only exercises for my equipment</label></div><div id="library-items" style="max-height:48vh;overflow:auto">${all.map(ex=>`<div class="option library-entry" data-name="${escapeAttr((ex.name+' '+ex.p).toLowerCase())}" data-compatible="${compatible(ex)?'yes':'no'}"><b>${escapeAttr(ex.name)}</b><div class="small muted">${escapeAttr(ex.p)} · ${escapeAttr(ex.eq.join(', '))} ${compatible(ex)?'· Available now':'· Different equipment needed'}</div><p class="small">${escapeAttr(ex.steps[0]||'Move with control.')}</p><button class="secondary" onclick="S.prefs['${ex.id}']='more';save();toast('Added to preferred exercises')">♡ Prefer</button></div>`).join('')}</div><button class="secondary" onclick="closeModal()">Close</button>`);

function filterLibraryItems(query){const q=(query||'').toLowerCase();const only=document.getElementById('only-compatible')?.checked;document.querySelectorAll('.library-entry').forEach(x=>x.style.display=x.dataset.name.includes(q)&&(!only||x.dataset.compatible==='yes')?'':'none')}
function library(){return [...EX,...EXTENDED_EX.filter(x=>x.id!=='v4s_supine_glute_bridge_disabled'),...(S.customExercises||[])]}
function preferenceScore(ex){const p=S.prefs[ex.id]||'neutral';return p==='more'?18:p==='less'?-15:p==='never'?-999:0}
function recentPenalty(ex){const recent=S.workouts.filter(w=>w.completed&&daysAgo(w.date)<7).flatMap(w=>w.exercises.map(e=>e.id));const n=recent.filter(id=>id===ex.id).length;return Math.min(14,n*2)}
function chooseKind(){if(S.readiness.energy==='low'||S.readiness.soreness==='aLot'||readinessScore()<48)return 'recovery';const n=weekStrengthCount();if(n<S.profile.minStrength)return 'strength';if(n>=S.profile.maxStrength)return readinessScore()>72?'conditioning':'recovery';return readinessScore()>=62?'strength':'conditioning'}
function targetWeight(ex){if(!ex.eq.includes('dumbbells'))return 0;const hist=S.strength[ex.id];const vals=(S.profile.homeDB||[]).slice().sort((a,b)=>a-b);if(!vals.length)return 0;const raw=hist?.nextWeight||vals[vals.length-1];return vals.reduce((best,v)=>Math.abs(v-raw)<Math.abs(best-raw)?v:best,vals[0]);}
function buildCardioItems(targetMinutes,count){
 const pool=library().filter(x=>x.type==='conditioning'&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never');
 const fallback=library().filter(x=>x.type==='conditioning'&&compatible(x)&&['flat_walk','march','side_steps','low_impact_jacks'].includes(x.id));
 let options=pool.length?pool:fallback;
 if(S.cardioActivity&&S.cardioActivity!=='auto'){
   const chosen=library().find(x=>x.id===S.cardioActivity);
   if(chosen&&chosen.type==='conditioning'&&compatible(chosen))options=[chosen,...options.filter(x=>x.id!==chosen.id)];
 }
 const n=Math.max(1,Math.min(12,count||2));
 const selected=options.slice(0,n);
 const per=Math.max(1,Math.floor(targetMinutes/selected.length));
 return selected.map((ex,i)=>({...makeWorkoutEx(ex),sets:[{minutes:per+(i===0?targetMinutes-per*selected.length:0),done:false}]}));
}
function generate(){
 const choice=S.workoutChoice||'strength';
 const minutes=Math.max(10,+S.readiness.minutes||30);
 let items=[];
 if(choice!=='cardio'&&(choice!=='both'||minutes>(+S.cardioMinutes||15))){
  const strengthTime=choice==='both'?Math.max(0,minutes-(+S.cardioMinutes||15)):minutes;
  const desired=S.buildMode==='count'?Math.max(1,Math.min(20,+S.exerciseCount||6)):Math.max(1,Math.min(20,Math.floor((strengthTime*60)/((3*10*(+S.repSeconds||5))+(2*(+S.restSeconds||0))+12))));
  const muscles=MUSCLES.map(m=>({m,r:muscleRecovery(m)})).sort((a,b)=>b.r-a.r);let lowerUsed=0;
  for(const mm of muscles){if(items.length>=desired)break;const lower=['Quadriceps','Hamstrings','Glutes','Calves'].includes(mm.m);if(lower&&S.profile.protectTomorrow&&lowerUsed>=Math.max(2,Math.ceil(desired/2)))continue;
   const cand=library().filter(x=>x.type==='strength'&&x.p===mm.m&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never').map(x=>({x,score:mm.r+preferenceScore(x)-recentPenalty(x)+(x.compound?4:0)+Math.random()*2})).sort((a,b)=>b.score-a.score)[0]?.x;
   if(cand){items.push(makeWorkoutEx(cand));if(lower)lowerUsed++}}
  if(items.length<desired)library().filter(x=>x.type==='strength'&&compatible(x)&&!items.some(y=>y.id===x.id)&&(S.prefs[x.id]||'neutral')!=='never').sort((a,b)=>b.compound-a.compound).slice(0,desired-items.length).forEach(x=>items.push(makeWorkoutEx(x)));
  items=alternate(items);
 }
 const cardioDuration=choice==='strength'?0:choice==='both'?Math.max(0,Math.min(minutes,+S.cardioMinutes||15)):minutes;
 if(choice!=='strength'&&cardioDuration>0)items.push(...buildCardioItems(cardioDuration,+S.cardioCount||2));
 if(!items.length)return toast('No compatible exercises available');
 const kind=choice==='cardio'?'conditioning':choice==='both'?'combined':'strength';
 activeWorkout={id:newID(),date:new Date().toISOString(),kind,title:choice==='cardio'?'Cardio Workout':choice==='both'?'Strength + Cardio':'Adaptive Strength',minutes,cardioMinutes:cardioDuration,completed:false,exercises:items,rationale:[...reasonText(kind),choice==='both'?'Strength and cardio selections are independent.':'Pace and rest are always adjustable.']};
 coachIndex=0;saveActive();render();
}
function reasonText(kind){const r=[];if(kind==='strength')r.push(`${weekStrengthCount()} strength days completed in the last 7 days; target is ${S.profile.minStrength}–${S.profile.maxStrength}.`);r.push(`Today's readiness is ${readinessScore()}/100.`);if(S.profile.protectTomorrow)r.push('Lower-body volume is capped to protect tomorrow.');r.push('Equipment is filtered to your selected items.');return r}
function makeWorkoutEx(ex){if(ex.type!=='strength')return {...ex,sets:[{minutes:ex.time||4,done:false}],feedback:null};const reps=ex.compound?8:10;const setCount=S.readiness.soreness==='aLot'?1:(S.profile.protectTomorrow&&['Quadriceps','Glutes','Hamstrings'].includes(ex.p)?2:3);const wt=targetWeight(ex);return {...ex,sets:Array.from({length:setCount},()=>({reps,weight:wt,done:false})),feedback:null}}

function completeWorkout(){if(!activeWorkout)return;activeWorkout.completed=true;activeWorkout.exercises.forEach(e=>{if(e.type==='strength'){const done=e.sets.filter(s=>s.done);if(done.length){const last=done[done.length-1];const fb=e.feedback;let next=last.weight;if(fb==='easy')next*=1.08;else if(fb==='right')next*=1.03;else if(fb==='hard')next*=1;else if(fb==='tooHard')next*=.9;S.strength[e.id]={lastWeight:last.weight,nextWeight:Math.max(0,Math.round(next*2)/2),date:new Date().toISOString(),bestReps:Math.max(...done.map(s=>s.reps))}}}});S.workouts.unshift(activeWorkout);S.lastWorkoutId=activeWorkout.id;save();activeWorkout=null;saveActive();showModal(`<h2>Workout summary</h2><p>${S.workouts[0].exercises.length} exercises · ${S.workouts[0].exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0)} logged sets</p><p>Completed reps: ${S.workouts[0].exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).reduce((v,z)=>v+(z.reps||0),0),0)}</p><p>Good form matters more than duration.</p>`);tab='today';render()}
function alternatives(id){const cur=(activeWorkout?.exercises||[]).find(e=>e.id===id);if(!cur)return[];let a=library().filter(x=>x.id!==id&&compatible(x)&&(S.prefs[x.id]||'neutral')!=='never');if(cur.type==='strength')a=a.filter(x=>x.type==='strength'&&x.p===cur.p);else a=a.filter(x=>x.type==='conditioning');return a.slice(0,5)}
function swap(oldId,newId){const i=activeWorkout.exercises.findIndex(e=>e.id===oldId);const ex=library().find(x=>x.id===newId);if(i>=0&&ex){snapshot();activeWorkout.exercises[i]=makeWorkoutEx(ex);saveActive();closeModal();toast('Exercise swapped');render()}}

function readinessControls(){return `<div class="field"><label>Workout type</label><div class="seg">${[['strength','💪 Strength only'],['cardio','❤️ Cardio only'],['both','💪 + ❤️ Both']].map(x=>`<button class="${(S.workoutChoice||'strength')===x[0]?'active':''}" onclick="S.workoutChoice='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div></div>${S.workoutChoice!=='strength'?`<div class="grid2"><div class="field"><label>Cardio minutes</label><select onchange="S.cardioMinutes=+this.value;save()">${[5,10,15,20,25,30,40,45,60].map(n=>`<option value="${n}" ${S.cardioMinutes==n?'selected':''}>${n} min</option>`).join('')}</select></div><div class="field"><label>Cardio activities</label><select onchange="S.cardioCount=+this.value;save()">${[1,2,3,4,5].map(n=>`<option value="${n}" ${S.cardioCount==n?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field"><label>Preferred cardio activity</label><select onchange="S.cardioActivity=this.value;save()"><option value="auto">Mix activities for me</option>${library().filter(x=>x.type==='conditioning').map(x=>`<option value="${x.id}" ${S.cardioActivity===x.id?'selected':''}>${x.name}</option>`).join('')}</select></div>`:''}<label class="check"><input type="checkbox" ${S.readiness.badDay?'checked':''} onchange="toggleBadDay()"><span><b>Bad day — use upright or supported alternatives</b><br><span class="small muted">Use your saved bad-day position preference. Head below heart remains prohibited.</span></span></label><div class="field"><label>Energy</label><div class="seg">${['low','okay','great'].map(x=>`<button class="${S.readiness.energy===x?'active':''}" onclick="S.readiness.energy='${x}';save();render()">${x==='okay'?'Okay':cap(x)}</button>`).join('')}</div></div><div class="field"><label>Soreness</label><div class="seg">${[['none','None'],['some','Some'],['aLot','A lot']].map(x=>`<button class="${S.readiness.soreness===x[0]?'active':''}" onclick="S.readiness.soreness='${x[0]}';save();render()">${x[1]}</button>`).join('')}</div></div><div class="field"><label>Build workout by</label><div class="seg"><button class="${S.buildMode==='count'?'active':''}" onclick="chooseBuild('count')">Number of exercises</button><button class="${S.buildMode==='time'?'active':''}" onclick="chooseBuild('time')">Time</button></div></div>${S.workoutChoice!=='cardio'&&S.buildMode==='count'?`<div class="field"><label>Different exercises</label><select onchange="updateBuild(this.value)">${[2,3,4,5,6,7,8,10,12,15,20].map(n=>`<option value="${n}" ${S.exerciseCount==n?'selected':''}>${n} exercises</option>`).join('')}</select></div>`:''}<div class="grid2"><div class="field"><label>Time ${S.buildMode==='count'?'(informational)':''}</label><select onchange="S.readiness.minutes=+this.value;save()">${[10,20,30,40,45].map(x=>`<option ${S.readiness.minutes==x?'selected':''} value="${x}">${x} min</option>`).join('')}</select></div><div class="field"><label>Equipment</label><button class="secondary" onclick="editEquipment()">Choose equipment</button></div></div>`}
function workoutView(){const w=activeWorkout;return `<section class="card"><div class="row"><div><div class="eyebrow">${w.kind}</div><h2>${w.title}</h2><div class="muted small">${w.exercises.length} exercises · ${S.buildMode==='time'?w.minutes+' min goal · ':''}Your chosen equipment</div></div><button class="ghost" onclick="toggleCoach()">${S.coach?'Full Plan':'Coach View'}</button></div><details class="details"><summary>Why this workout?</summary><ul class="list small muted">${w.rationale.map(x=>`<li>${x}</li>`).join('')}</ul></details><div class="chipline" style="margin-top:12px"><button class="secondary" onclick="editWorkout()">Edit workout</button><button class="secondary" onclick="editEquipment()">Change equipment</button><button class="secondary" onclick="toggleBadDay()">${S.readiness.badDay?'✓ Bad-day mode ON':'Bad-day alternatives'}</button><button class="secondary" onclick="undo()">Undo</button><button class="secondary" onclick="saveRoutine()">♡ Save routine</button><button class="secondary" onclick="addExercise()">+ Add exercise</button></div><p class="small muted">Repeat familiar movements across the week, with occasional new exercises to keep your plan interesting. Focus on controlled technique. ${S.repSeconds} seconds/rep is an optional pace guide, not a deadline. Rest whenever needed.</p></section>${S.coach?coachView(w):fullView(w)}<div class="container" style="padding-top:0"><button class="primary" onclick="finishPrompt()">Finish workout</button><button class="secondary" style="width:100%;margin-top:8px" onclick="if(confirm('Discard unsaved workout?')){activeWorkout=null;saveActive();render()}">Discard workout</button></div>`}

function demoMedia(e){
  const q=encodeURIComponent(e.name+' exercise proper form');
  const image=EMBEDDED_EXERCISE_ART[e.id];
  const supplementary='https://www.youtube.com/results?search_query='+q;
  return `<div class="demo-media"><b>Movement demonstration</b>${image?`<img class="exercise-illustration" src="${image}" alt="Start and finish illustrated guide for ${escapeAttr(e.name)}">`:'<p>Custom exercise: add your own demonstration image later.</p>'}<p class="small muted">Illustrated sequence is a simplified position guide. Follow the written technique instructions and your comfortable range.</p><a class="media-link" href="${supplementary}" target="_blank" rel="noopener noreferrer">Watch an additional demonstration ↗</a></div>`;
}

function coachView(w){const e=w.exercises[Math.min(coachIndex,w.exercises.length-1)];const i=w.exercises.indexOf(e);return `<div class="container" style="padding-top:0"><section class="card coach"><div class="row"><span class="badge">${i+1} of ${w.exercises.length}</span><button class="secondary" onclick="showAlternatives('${e.id}')">Swap exercise</button></div><div class="eyebrow" style="margin-top:16px">${e.p}</div><h2 style="font-size:27px">${e.name}</h2>${demoMedia(e)}${setsHTML(e,i)}<details class="details"><summary>How to do it</summary><ol class="list small">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol>${e.tips?.length?`<div class="notice">${e.tips.join(' ')}</div>`:''}</details>${e.type==='strength'?feedbackHTML(e,i):''}<div class="coach-nav"><button class="secondary" ${i===0?'disabled':''} onclick="coachIndex=Math.max(0,coachIndex-1);render()">Back</button><button class="secondary" ${i===w.exercises.length-1?'disabled':''} onclick="coachIndex=Math.min(${w.exercises.length-1},coachIndex+1);render()">Next</button></div></section></div>`}
function fullView(w){return `<div class="container" style="padding-top:0">${w.exercises.map((e,i)=>`<section class="workout-card"><div class="row"><div><div class="exercise-title">${e.name}</div><span class="badge">${e.p}</span></div><button class="secondary" onclick="showAlternatives('${e.id}')">Swap exercise</button></div>${demoMedia(e)}${setsHTML(e,i)}<details class="details"><summary>Technique</summary><ol class="list small">${e.steps.map(x=>`<li>${x}</li>`).join('')}</ol></details>${e.type==='strength'?feedbackHTML(e,i):''}</section>`).join('')}</div>`}
function setsHTML(e,ei){if(e.type!=='strength')return `<div class="sets"><label class="check"><input type="checkbox" ${e.sets[0].done?'checked':''} onchange="updateSet(${ei},0,'done',this.checked)"><span><b>${e.sets[0].minutes} minutes</b> · mark complete</span></label></div>`;return `<div class="sets">${e.sets.map((s,si)=>`<div class="setrow"><b>${si+1}</b><input aria-label="weight" type="number" inputmode="decimal" value="${s.weight}" onchange="updateSet(${ei},${si},'weight',this.value)"><input aria-label="reps" type="number" inputmode="numeric" value="${s.reps}" onchange="updateSet(${ei},${si},'reps',this.value)"><input type="checkbox" ${s.done?'checked':''} onchange="updateSet(${ei},${si},'done',this.checked)"></div>`).join('')}<div class="small muted">Weight · reps · ✓</div></div>`}
function feedbackHTML(e,ei){return `<div class="details"><details><summary>Technique notes and form checklist</summary><label class=check><input type=checkbox ${e.checklist?.controlled?'checked':''} onchange="toggleChecklist(${ei},'controlled',this.checked)">Controlled movement</label><label class=check><input type=checkbox ${e.checklist?.stable?'checked':''} onchange="toggleChecklist(${ei},'stable',this.checked)">Stable position</label><label class=check><input type=checkbox ${e.checklist?.comfortable?'checked':''} onchange="toggleChecklist(${ei},'comfortable',this.checked)">Comfortable range</label><div class=field><label>My notes</label><input value="${escapeAttr(e.techniqueNote||'')}" onchange="setNote(${ei},this.value)" placeholder="How the movement felt"></div></details><b>How was that?</b><div class="feedback">${[['easy','Too easy'],['right','Just right'],['hard','Hard but doable'],['tooHard','Too hard']].map(x=>`<button class="${e.feedback===x[0]?'selected':''}" onclick="setFeedback(${ei},'${x[0]}')">${x[1]}</button>`).join('')}</div></div>`}
function history(){return `<div class="container"><section class="card"><div class="eyebrow">History</div><h1>Your work counts.</h1><p class="muted">Completed workouts and manually logged purposeful movement.</p></section>${S.workouts.length?S.workouts.map(w=>`<section class="card"><div class="row"><div><h3>${w.title}</h3><div class="small muted">${new Date(w.date).toLocaleString()} · ${w.kind}</div></div><span class="pill">${w.exercises.length} items</span></div><div class="small">${w.exercises.map(e=>e.name).join(' · ')}</div></section>`).join(''):'<div class="empty">No workouts saved yet.</div>'}${S.movements.map(m=>`<section class="card"><div class="row"><h3>${escapeAttr(m.type)}</h3><button class="secondary" onclick="movementModal(${JSON.stringify(String(m.id))})">Edit</button></div><div class="small muted">${new Date(m.date).toLocaleString()} · ${movementMetrics(m)}</div>${m.note?`<p class="small">${escapeAttr(m.note)}</p>`:''}</section>`).join('')}</div>`}
function progress(){const total=S.workouts.length;const week=weekStrengthCount();const mastered=Object.keys(S.strength).length;const rec=MUSCLES.map(m=>({m,r:muscleRecovery(m)}));return `<div class="container"><section class="card"><div class="eyebrow">Progress</div><h1>Capability over punishment.</h1><p class="muted">ForgeFit emphasizes consistency, strength progress, stamina, and how you feel—not just scale weight.</p><div class="grid3"><div class="stat"><strong>${total}</strong><span class="small muted">Workouts</span></div><div class="stat"><strong>${week}</strong><span class="small muted">Strength / 7d</span></div><div class="stat"><strong>${mastered}</strong><span class="small muted">Tracked lifts</span></div></div></section><section class="card"><h3>Logged movement</h3><div class="grid3"><div class="stat"><strong>${S.movements.length}</strong><span class="small muted">Activities</span></div><div class="stat"><strong>${Math.round(S.movements.reduce((n,m)=>n+(Number(m.minutes)||0),0)*10)/10}</strong><span class="small muted">Minutes recorded</span></div><div class="stat"><strong>${Math.round(S.movements.reduce((n,m)=>n+(m.distance!=null?(m.unit==='km'?Number(m.distance)/1.609344:Number(m.distance)):0),0)*100)/100}</strong><span class="small muted">Miles recorded</span></div></div><p class="small muted">Totals include only measurements you entered. Distance is converted to miles for the summary.</p></section><section class="card"><h3>Estimated muscle recovery</h3><p class="small muted">Based on logged workouts, not a measurement of how recovered a muscle actually is.</p>${rec.map(x=>`<div class="progress-row"><div class="row small"><b>${x.m}</b><span>${x.r}%</span></div><div class="bar"><span style="width:${x.r}%"></span></div></div>`).join('')}</section><section class="card"><h3>Strength and repetition history</h3>${library().filter(x=>x.type==='strength').map(e=>{const rows=S.workouts.filter(w=>w.completed).flatMap(w=>w.exercises.filter(x=>x.id===e.id).map(x=>({date:w.date,sets:x.sets.filter(t=>t.done)}))).filter(x=>x.sets.length);return {e,rows}}).filter(x=>x.rows.length).map(({e,rows})=>`<details class=details><summary>${escapeAttr(e.name)} · ${rows.length} sessions</summary>${rows.slice(0,12).map(r=>`<div class=small style="margin:7px 0">${new Date(r.date).toLocaleDateString()}: ${r.sets.map(t=>`${t.reps} reps @ ${t.weight} lb`).join(' / ')}</div>`).join('')}<div class=bar><span style="width:${Math.min(100,rows.length*12)}%"></span></div></details>`).join('')||'<p class=muted>No completed sets yet.</p>'}</section><section class="card"><h3>Strength estimates</h3>${Object.keys(S.strength).length?Object.entries(S.strength).map(([id,v])=>{const ex=library().find(x=>x.id===id);return `<div class="row" style="padding:8px 0"><span>${ex?.name||id}</span><b>${v.nextWeight} lb next</b></div>`}).join(''):'<p class="muted small">Finish some strength workouts and ForgeFit will begin adapting recommended loads.</p>'}</section></div>`}
function updatePositionRule(key,checked){
 const keys=['avoidHeadFlat','badDayUpright','avoidStanding','avoidSeated'];
 if(!keys.includes(key))return;
 S.profile[key]=checked; S.profile.avoidHeadBelowHeart=true;
 save();render();toast('Position rule saved. New workouts use your choices.');
}
function resetPositionRules(){
 S.profile.avoidHeadBelowHeart=true;S.profile.avoidHeadFlat=false;
 S.profile.badDayUpright=true;S.profile.avoidStanding=false;S.profile.avoidSeated=false;
 save();render();toast('Position rules restored');
}
function positionRuleControls(){
 const p=S.profile;
 const control=(key,label,desc)=>`<label class="check"><input type="checkbox" ${p[key]?'checked':''} onchange="updatePositionRule('${key}',this.checked)"><span><b>${label}</b><br><span class="small muted">${desc}</span></span></label>`;
 return `<div class="notice"><b>Always protected:</b> Never head below heart. Lying flat is allowed unless you turn on Avoid lying-flat exercises below.</div>
 ${control('avoidHeadFlat','Do NOT suggest exercises lying flat','Unchecked = lying flat on the floor is allowed (provided the head is not below the heart).')}
 ${control('badDayUpright','On bad days, swap floor exercises for upright or supported moves','Only when Bad day is turned on before a workout.')}
 ${control('avoidStanding','Avoid standing exercises','Prefer other positions when compatible exercises exist.')}
 ${control('avoidSeated','Avoid seated exercises','Prefer other positions when compatible exercises exist.')}
 <button class="secondary" onclick="resetPositionRules()">Restore my default position rules</button>
 <p class="small muted" style="margin-top:10px">Changes are saved automatically and affect new workouts and exercise alternatives. Already-generated workouts will not automatically change; regenerate or swap an exercise to update them.</p>`;
}
function settings(){return `<div class="container"><section class="card"><div class="eyebrow">Your plan</div><h1>Personalized for you</h1><p class="small muted"><b>ForgeFit Position Editor v4.1</b> · floor exercises allowed by default</p><div class="field"><label>Default workout length</label><select onchange="S.profile.duration=+this.value;S.readiness.minutes=+this.value;save()">${[20,30,35,40,45].map(x=>`<option ${S.profile.duration==x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid2"><div class="field"><label>Minimum strength days</label><input type="number" min="1" max="6" value="${S.profile.minStrength}" onchange="S.profile.minStrength=+this.value;save()"></div><div class="field"><label>Maximum strength days</label><input type="number" min="1" max="7" value="${S.profile.maxStrength}" onchange="S.profile.maxStrength=+this.value;save()"></div></div><label class="check"><input type="checkbox" ${S.profile.protectTomorrow?'checked':''} onchange="S.profile.protectTomorrow=this.checked;save()"><span><b>Protect tomorrow</b><br><span class="small muted">Cap lower-body dose so strength work doesn't routinely make the next morning miserable.</span></span></label></section><section class="card"><h3>Workout controls</h3><div class="field"><label>Default rest between sets (seconds)</label><input type="number" min="0" max="300" value="${S.restSeconds}" onchange="S.restSeconds=Math.max(0,+this.value||0);save()"></div><div class="field"><label>Optional pace guide per rep (seconds)</label><input type="number" min="0" max="15" value="${S.repSeconds}" onchange="S.repSeconds=Math.max(0,+this.value||0);save()"></div></section><section class="card"><h3>Favorite routines</h3>${(S.favorites||[]).length?(S.favorites||[]).map((r,i)=>`<div class="row option"><span><b>${escapeAttr(r.name)}</b><div class=small>${r.exercises.length} exercises</div></span><button class=secondary onclick="startRoutine(${i})">Start</button></div>`).join(''):'<p class=small muted>Save a workout as a routine while exercising.</p>'}</section><section class="card"><h3>Browse 50+ strength &amp; 50+ cardio choices</h3><div class="chipline"><button class="primary" onclick="browseLibrary('strength')">Browse strength</button><button class="primary" onclick="browseLibrary('cardio')">Browse cardio</button></div><h3>Custom exercise library</h3><button class=secondary onclick="addCustom()">+ Add custom exercise</button>${(S.customExercises||[]).map(e=>`<div class=option><b>${escapeAttr(e.name)}</b><div class=small>${e.p} · ${e.eq.join(', ')}</div></div>`).join('')}</section><section class="card"><h3>My equipment</h3>${equipmentSummary()}<button class="primary" onclick="editEquipment()">✎ Edit equipment</button><p class="small muted">Choose equipment directly, regardless of location. New workouts use your selections.</p></section><section class="card"><h3>Position Rules Editor · v4.1</h3><p class="small muted">Change these options directly below. Changes save immediately.</p>${positionRuleControls()}</section><section class="card"><h3>Exercise preferences</h3><p class="muted small">Tap any exercise to tell ForgeFit to show it more, less, or never. Lunges are not restricted.</p>${library().filter(x=>x.type==='strength').map(x=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #f2f4f7"><span>${x.name}</span><select style="width:120px;padding:7px;border:1px solid var(--line);border-radius:9px" onchange="S.prefs['${x.id}']=this.value;save()"><option value="neutral" ${(S.prefs[x.id]||'neutral')==='neutral'?'selected':''}>Neutral</option><option value="more" ${S.prefs[x.id]==='more'?'selected':''}>More</option><option value="less" ${S.prefs[x.id]==='less'?'selected':''}>Less</option><option value="never" ${S.prefs[x.id]==='never'?'selected':''}>Never</option></select></div>`).join('')}</section><section class="card"><h3>Data</h3><button class="secondary" onclick="exportData()">Export backup</button> <button class="secondary danger" onclick="if(confirm('Reset all ForgeFit data?')){localStorage.removeItem('forgefit');localStorage.removeItem('forgefit-active');location.reload()}">Reset</button><p class="small muted" style="margin-top:10px">Your workout history is stored in Safari on this iPhone. This version does not have HealthKit access.</p></section></div>`}
function movementModal(editId=null){
 const m=editId===null?null:S.movements.find(x=>String(x.id)===String(editId));
 const mode=m?(m.logMode||(m.distance!=null&&m.minutes!=null?'both':m.distance!=null?'distance':'time')):'both';
 const activities=['Walk','Hill walk','Stairs','Mobility','Other purposeful movement'];
 showModal(`<h2>${m?'Edit':'Log'} movement</h2><p class="small muted">Record time, distance, or both. Leave unused measurements blank.</p>
 <div class="field"><label>Activity</label><select id="mvtype">${activities.map(a=>`<option ${m?.type===a?'selected':''}>${a}</option>`).join('')}</select></div>
 <div class="field"><label>What would you like to record?</label><select id="mvmode" onchange="updateMovementFields()">${[['time','Time only'],['distance','Distance only'],['both','Both time and distance']].map(a=>`<option value="${a[0]}" ${mode===a[0]?'selected':''}>${a[1]}</option>`).join('')}</select></div>
 <div class="field" id="mvtimefield"><label>Time (minutes)</label><input id="mvmin" type="number" min="0.01" step="any" inputmode="decimal" value="${m?.minutes??''}" placeholder="Minutes"></div>
 <div class="field" id="mvdistancefield"><label>Distance</label><input id="mvdistance" type="number" min="0.01" step="any" inputmode="decimal" value="${m?.distance??''}" placeholder="Distance"><select id="mvunit"><option value="mi" ${m?.unit!=='km'?'selected':''}>Miles</option><option value="km" ${m?.unit==='km'?'selected':''}>Kilometers</option></select></div>
 <div class="field"><label>Optional note</label><input id="mvnote" value="${escapeAttr(m?.note||'')}" placeholder="How it felt, route, etc."></div>
 <button class="primary" onclick="logMovement(${m?JSON.stringify(String(m.id)):'null'})">${m?'Save changes':'Save movement'}</button>`);
 updateMovementFields();
}
function updateMovementFields(){
 const mode=document.getElementById('mvmode').value;
 document.getElementById('mvtimefield').style.display=mode==='distance'?'none':'';
 document.getElementById('mvdistancefield').style.display=mode==='time'?'none':'';
}
function logMovement(editId=null){
 const mode=document.getElementById('mvmode').value;
 const needTime=mode!=='distance',needDistance=mode!=='time';
 const minText=document.getElementById('mvmin').value.trim(),distanceText=document.getElementById('mvdistance').value.trim();
 const minutes=needTime&&minText!==''?Number(minText):null;
 const distance=needDistance&&distanceText!==''?Number(distanceText):null;
 if((needTime&&(!Number.isFinite(minutes)||minutes<=0))||(needDistance&&(!Number.isFinite(distance)||distance<=0)))return toast('Enter a positive '+(needTime&&needDistance?'time and distance':needTime?'time':'distance'));
 const entry={id:editId===null?newID():editId,date:new Date().toISOString(),type:document.getElementById('mvtype').value,logMode:mode,minutes,distance,unit:document.getElementById('mvunit').value,note:document.getElementById('mvnote').value};
 if(editId!==null){const index=S.movements.findIndex(x=>String(x.id)===String(editId));if(index<0)return toast('Entry not found');entry.date=S.movements[index].date;S.movements[index]=entry}
 else S.movements.unshift(entry);
 save();closeModal();tab='history';toast(editId===null?'Movement saved':'Movement updated');render();
}
function movementMetrics(m){
 const vals=[];
 if(m.minutes!=null&&Number(m.minutes)>0)vals.push(`${m.minutes} min`);
 if(m.distance!=null&&Number(m.distance)>0)vals.push(`${m.distance} ${m.unit==='km'?'km':'mi'}`);
 if(m.minutes>0&&m.distance>0){const miles=m.unit==='km'?m.distance/1.609344:m.distance;vals.push(`${(m.minutes/miles).toFixed(1)} min/mi`)}
 return vals.join(' · ')||'No measurements';
}

function exportData(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ForgeFit-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function escapeAttr(s){return String(s).replaceAll("&","&amp;").replaceAll("\"","&quot;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function render(){document.getElementById('headerMode').textContent=activeWorkout?(activeWorkout.kind==='strength'?'Strength':activeWorkout.kind==='conditioning'?'Cardio':activeWorkout.kind==='combined'?'Strength + Cardio':'Recovery'):'Adaptive';document.getElementById('app').innerHTML=tab==='today'?today():tab==='history'?history():tab==='progress'?progress():settings();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();scrollTo(0,0)});document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script>
</body>
</html>
